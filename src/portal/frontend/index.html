<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Self-hosted secrets and OAuth for agents. Store credentials encrypted, mint short-lived tokens, and keep secrets out of code."
    />
    <meta name="theme-color" content="#0b0f13" />
    <link rel="canonical" href="https://vault.donkeywork.dev/" />
    <link
      rel="icon"
      type="image/svg+xml"
      href="/brand/am-ai-sage-light.svg"
      media="(prefers-color-scheme: light)"
    />
    <link
      rel="icon"
      type="image/svg+xml"
      href="/brand/am-ai-sage-dark.svg"
      media="(prefers-color-scheme: dark)"
    />
    <title>Vault</title>
    <meta property="og:site_name" content="andrewmorgan.ai" />
    <meta property="og:title" content="Vault" />
    <meta
      property="og:description"
      content="Self-hosted secrets and OAuth for agents. Store credentials encrypted, mint short-lived tokens, and keep secrets out of code."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://vault.donkeywork.dev/" />
    <script>
      // Apply the stored theme before paint so the first frame doesn't flash the wrong one.
      try {
        document.documentElement.classList.toggle('dark', (localStorage.getItem('vault-theme') || 'dark') === 'dark')
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
